<!DOCTYPE html>
<html lang="en">
<head>
  <title>WONDERER - LAAG ni kHEr</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- PWA MANIFEST UG ICON -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/15aQxvPrKO7S2lVUdhQ99BrwpJqcNKohl">
  <meta name="theme-color" content="#020617">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .border-dotted-gold { border-top: 3px dotted #f59e0b; }
    .border-solid-gold { border-top: 5px solid #d97706; }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 font-sans p-2 sm:p-6">
  
  <div class="max-w-lg mx-auto bg-slate-900 rounded-3xl shadow-2xl overflow-hidden border-4 border-amber-500">
    
    <!-- HEADER -->
    <div class="bg-gradient-to-r from-amber-600 to-amber-700 p-4 flex items-center justify-center space-x-4 shadow-md">
      <img src="https://lh3.googleusercontent.com/d/15aQxvPrKO7S2lVUdhQ99BrwpJqcNKohl" alt="Wonderer Logo" class="w-28 h-28 rounded-full border-2 border-amber-300 shadow-lg">
      <div class="text-center">
        <h1 class="text-4xl font-bold font-mono text-slate-950 tracking-wider drop-shadow">WONDERER</h1>
        <h2 class="text-xl text-amber-200 font-semibold">(LAAG ni kHEr)</h2>
        <h3 class="text-sm text-amber-100">Diary v1.0</h3>
      </div>
    </div>

    <div class="p-4 sm:p-6 space-y-4">
      
      <!-- STATUS & DASHBOARD COUNTER -->
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 flex justify-between items-center text-xs font-semibold">
        <div>
          <span class="text-slate-400">SIGNAL:</span> <span id="signalStatus" class="text-green-400">🟢 ONLINE</span>
        </div>
        <div>
          <span class="text-slate-400">PENDING OFFLINE:</span> <span id="pendingCount" class="text-amber-400 font-bold">0</span>
        </div>
      </div>

      <!-- DATE & LOCATION DISPLAY -->
      <div class="text-center space-y-1">
        <div id="theDate" class="text-lg font-medium text-amber-400"></div>
        <div id="status" class="text-amber-500 font-bold animate-pulse text-lg">Locating...</div>
        <a id="map-link" target="_blank" class="text-2xl font-bold text-amber-300 hover:underline block"></a>
        <div id="geoAddress" class="text-sm font-semibold text-slate-300"></div>
      </div>

      <div class="border-dotted-gold my-4"></div>
      <div class="border-solid-gold my-4"></div>

      <!-- FORM FIELDS -->
      <div class="space-y-4">
        <div class="flex items-center justify-between">
          <label class="text-amber-400 italic font-semibold w-1/3">Remarks:</label>
          <input type="text" id="remarks" class="w-2/3 bg-slate-800 text-white border-b-2 border-slate-700 focus:border-amber-500 outline-none text-xl p-1 rounded px-2" />
        </div>

        <div class="flex items-center justify-between">
          <label class="text-amber-400 italic font-semibold w-1/3 text-right pr-4">ODO:</label>
          <input type="number" id="odo" class="w-2/3 bg-slate-800 text-white border-b-2 border-slate-700 focus:border-amber-500 outline-none text-xl p-1 text-right rounded px-2" />
        </div>

        <div class="flex items-center justify-between">
          <label class="text-amber-400 italic font-semibold w-1/3">Expense:</label>
          <select id="expense" class="w-2/3 bg-slate-800 text-white border-b-2 border-slate-700 focus:border-amber-500 outline-none text-lg p-1 rounded px-2">
            <option value="" disabled selected>-- Select --</option>
            <option value="fuel">Fuel</option>
            <option value="oil">Oil/Coolant</option>
            <option value="meal">Meal/Food/Snack</option>
            <option value="lodge">Lodge/Hotel/Inn</option>
            <option value="roro">Roro/Barge/Boat</option>
            <option value="passenger">Passenger's Ticket</option>
            <option value="medicine">Medicine</option>
            <option value="repair">Repairs & Maintenance</option>
            <option value="parts">Parts & Supplies</option>
            <option value="amusement">Amusement Parks</option>
            <option value="clothing">Clothing/Souvenir</option>
            <option value="toll">Road Tolls</option>
          </select>
        </div>

        <div class="flex items-center justify-between">
          <label class="text-amber-400 italic font-semibold w-1/3 text-right pr-4">Amount:</label>
          <input type="number" placeholder="₱ 0.00" step="0.01" id="amount" class="w-2/3 bg-slate-800 text-white border-b-2 border-slate-700 focus:border-amber-500 outline-none text-2xl p-1 text-right font-bold rounded px-2" />
        </div>
      </div>

      <div class="border-solid-gold my-4 mt-6"></div>

      <!-- SUBMIT BUTTON -->
      <button id="find-me" class="w-full mt-4 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-black text-3xl py-5 rounded-full shadow-lg transition duration-300 ease-in-out transform hover:scale-105 tracking-widest">
        S U B M I T
      </button>

      <!-- VIEW EXPENSE SUMMARY BUTTON -->
      <button onclick="showExpenseSummary()" class="w-full mt-3 bg-slate-800 hover:bg-slate-700 text-amber-400 border border-amber-500 font-bold text-lg py-3 rounded-full shadow-md transition duration-300">
        📊 VIEW EXPENSE SUMMARY
      </button>

    </div>

    <!-- FOOTER -->
    <div class="bg-slate-950 text-center text-amber-500 p-2 text-xs border-t border-slate-800">
      © 2022 rayHARGG technicus™
    </div>

  </div>

  <script>
    // SUPABASE SETUP
    const SUPABASE_URL = 'https://iilfklquzyxmdergwawh.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_xO3twPzyDBLhdltnkwoS3w_xswYLyf_';
    const mySupabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Initializations
    document.getElementById("theDate").innerHTML = new Date().toDateString();
    let currentLat = null;
    let currentLng = null;
    let currentDms = null;
    let currentAddress = null;
    let isSyncing = false;

    geoPangitaaKo();
    updatePendingCounter();
    checkRealInternet();

    function toDMS(coordinate) {
      const absolute = Math.abs(coordinate);
      const degrees = Math.floor(absolute);
      const minutesNotTruncated = (absolute - degrees) * 60;
      const minutes = Math.floor(minutesNotTruncated);
      const seconds = Math.floor((minutesNotTruncated - minutes) * 60);
      return degrees + "° " + minutes + "' " + seconds + '"';
    }

    function geoPangitaaKo() {
      const status = document.querySelector('#status');
      const mapLink = document.querySelector('#map-link');
      const geoAddress = document.getElementById('geoAddress');

      if (!navigator.geolocation) {
        status.textContent = 'Geolocation is not supported by your browser';
        return;
      }

      status.textContent = 'Locating...';
      
      const geoOptions = {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      };
      
      navigator.geolocation.getCurrentPosition((position) => {
        currentLat = position.coords.latitude;
        currentLng = position.coords.longitude;
        
        const latDMS = toDMS(currentLat) + (currentLat >= 0 ? " N" : " S");
        const lngDMS = toDMS(currentLng) + (currentLng >= 0 ? " E" : " W");
        currentDms = `${latDMS}, ${lngDMS}`;

        mapLink.href = `https://www.google.com/maps/place/${currentLat},${currentLng}`;
        mapLink.textContent = currentDms;
        
        status.textContent = ''; 
        
        // Ibutang dayon ang Raw Coordinates sa address (Di mag-depend sa internet)
        currentAddress = `📍 Lat: ${currentLat.toFixed(6)} | Lon: ${currentLng.toFixed(6)}`;
        geoAddress.innerHTML = currentAddress;

        // KUNG ONLINE RA: Kuhaon ang tinuod nga address gikan sa Nominatim API
        if (navigator.onLine) {
          fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${currentLat}&lon=${currentLng}`)
            .then(response => response.json())
            .then(data => {
              if (data.display_name) {
                 currentAddress = data.display_name;
                 geoAddress.innerHTML = `📍 ${currentAddress}`; 
              }
            })
            .catch(error => {
              console.log("Address fetch skipped (Network or API issue).");
            });
        }

      }, (error) => {
        status.textContent = 'Error: ' + error.message;
      }, geoOptions);
    }

    async function getIpAddress() {
      if (!navigator.onLine) return "Offline IP";
      try {
        const res = await fetch("https://api.ipify.org?format=json");
        const data = await res.json();
        return data.ip;
      } catch (e) {
        return "Unknown IP";
      }
    }

    // INTERNET & SYNC MONITORING
    function checkRealInternet() {
      const sigStatus = document.getElementById('signalStatus');
      if (!sigStatus) return;
      if (navigator.onLine) {
        sigStatus.innerHTML = "🟢 ONLINE";
        sigStatus.style.color = "#4ade80";
        let offlineData = JSON.parse(localStorage.getItem('kher_offline_diary')) || [];
        if (offlineData.length > 0 && !isSyncing) {
          syncOfflineData();
        }
      } else {
        sigStatus.innerHTML = "🔴 OFFLINE";
        sigStatus.style.color = "#f87171";
      }
    }

    window.addEventListener('online', checkRealInternet);
    window.addEventListener('offline', checkRealInternet);
    setInterval(checkRealInternet, 10000);

    function updatePendingCounter() {
      let offlineData = JSON.parse(localStorage.getItem('kher_offline_diary')) || [];
      const pCount = document.getElementById('pendingCount');
      if (pCount) {
        pCount.innerText = offlineData.length;
      }
    }

    async function sendDataToServer(dbRow) {
      const { error } = await mySupabase
        .from('kher_diary')
        .insert([dbRow]);
      if (error) {
        console.error("Supabase Error:", error);
        return false;
      }
      return true;
    }

    async function syncOfflineData() {
      if (isSyncing) return;
      let offlineData = JSON.parse(localStorage.getItem('kher_offline_diary')) || [];
      if (offlineData.length === 0) return;

      isSyncing = true;
      const btn = document.getElementById('find-me');
      if (btn) {
        btn.textContent = "SYNCING OFFLINE DATA...";
        btn.disabled = true;
      }

      let failedData = [];
      for (let i = 0; i < offlineData.length; i++) {
        let success = await sendDataToServer(offlineData[i]);
        if (!success) {
          failedData.push(offlineData[i]);
        }
      }

      if (failedData.length > 0) {
        localStorage.setItem('kher_offline_diary', JSON.stringify(failedData));
      } else {
        localStorage.removeItem('kher_offline_diary');
        Swal.fire({
          toast: true,
          position: 'top-end',
          icon: 'success',
          title: 'Naka-sync na ang offline data sa Supabase!',
          showConfirmButton: false,
          timer: 3000,
          background: "#1e293b",
          color: "#fff"
        });
      }

      updatePendingCounter();
      if (btn) {
        btn.textContent = "S U B M I T";
        btn.disabled = false;
      }
      isSyncing = false;
    }

    function saveToLocalStorage(dbRow) {
      let savedData = JSON.parse(localStorage.getItem('kher_offline_diary')) || [];
      savedData.push(dbRow);
      localStorage.setItem('kher_offline_diary', JSON.stringify(savedData));
      updatePendingCounter();
    }

    async function geoSaveMe() {
      const btn = document.getElementById('find-me');
      btn.disabled = true;
      btn.textContent = "SAVING...";

      const rem = document.getElementById('remarks').value;
      const odo = document.getElementById('odo').value || null;
      const expenseType = document.getElementById("expense").value;
      const amount = parseFloat(document.getElementById("amount").value) || 0;
      
      const ip = await getIpAddress();

      const now = new Date();
      const timeSubmitStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

      const dbRow = {
        dms: currentDms,
        address: currentAddress,
        ip_address: ip,
        remarks: rem,
        odo: odo,
        time_submit: timeSubmitStr
      };

      if (expenseType && amount > 0) {
        dbRow[expenseType] = amount;
      }

      if (navigator.onLine) {
        let success = await sendDataToServer(dbRow);
        if (success) {
          Swal.fire({
            position: "center",
            title: "Your diary has been saved",
            text: "RECORDED ONLINE!",
            icon: 'success',
            background: "#1e293b",
            color: "#fff",
            showConfirmButton: false,
            timer: 2000
          });
          resetForm();
        } else {
          saveToLocalStorage(dbRow);
          Swal.fire({
            title: "Saved Offline",
            text: "Wala ma-save sa server, gi-store sa phone muna.",
            icon: "warning",
            background: "#1e293b",
            color: "#fff"
          });
          resetForm();
        }
      } else {
        saveToLocalStorage(dbRow);
        Swal.fire({
          position: "center",
          title: "Saved to Phone (Offline)",
          text: "Mu-auto sync kini inig abot sa internet!",
          icon: 'info',
          background: "#1e293b",
          color: "#fff",
          showConfirmButton: false,
          timer: 2500
        });
        resetForm();
      }

      btn.disabled = false;
      btn.textContent = "S U B M I T";
    }

    function resetForm() {
      document.getElementById('remarks').value = '';
      document.getElementById('odo').value = '';
      document.getElementById("expense").value = '';
      document.getElementById("amount").value = '';
      geoPangitaaKo();
    }

    document.querySelector('#find-me').addEventListener('click', geoSaveMe);

    // SERVICE WORKER REGISTRATION PARA SA PWA (OFFLINE MODE)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => { console.log('Service Worker registered!', reg.scope); })
          .catch((err) => { console.log('Service Worker registration failed:', err); });
      });
    }

    // FUNCTION PARA SA EXPENSE SUMMARY
    async function showExpenseSummary() {
      // Kuhaon ang tanang data gikan sa Supabase table
      const { data, error } = await mySupabase.from('kher_diary').select('*');
      
      if (error) {
        console.error(error);
        Swal.fire({
          title: "Error!",
          text: "Dili ma-load ang summary gikan sa database.",
          icon: "error",
          background: "#1e293b",
          color: "#fff"
        });
        return;
      }

      if (!data || data.length === 0) {
        Swal.fire({
          title: "Walay Record",
          text: "Wala pa kay natala nga data sa Supabase.",
          icon: "info",
          background: "#1e293b",
          color: "#fff"
        });
        return;
      }

      // Listahan sa tanang expense categories base sa imong dropdown
      const categories = ['fuel', 'oil', 'meal', 'lodge', 'roro', 'passenger', 'medicine', 'repair', 'parts', 'amusement', 'clothing', 'toll'];
      let totals = {};
      categories.forEach(cat => totals[cat] = 0);
      let grandTotal = 0;

      // I-loop ang tanang rows ug i-sum ang gasto matag category
      data.forEach(row => {
        categories.forEach(cat => {
          if (row[cat]) {
            let val = parseFloat(row[cat]) || 0;
            totals[cat] += val;
            grandTotal += val;
          }
        });
      });

      // Himuon ang nindot nga HTML list para sa SweetAlert
      let htmlContent = `<div style="text-align: left; max-height: 250px; overflow-y: auto; padding: 5px;">`;
      let hasExpense = false;

      categories.forEach(cat => {
        if (totals[cat] > 0) {
          hasExpense = true;
          htmlContent += `<div style="display: flex; justify-content: space-between; border-bottom: 1px solid #334155; padding: 6px 0;">
                            <span style="text-transform: uppercase; color: #f59e0b; font-weight: bold;">${cat}:</span>
                            <span style="color: #fff;">₱ ${totals[cat].toFixed(2)}</span>
                          </div>`;
        }
      });

      if (!hasExpense) {
        htmlContent += `<p style="text-align: center; color: #94a3b8;">Wala pa kay natala nga gasto sa bisan unsa nga category.</p>`;
      }

      htmlContent += `</div>`;
      htmlContent += `<div style="margin-top: 15px; padding-top: 10px; border-top: 2px dashed #f59e0b; display: flex; justify-content: space-between; font-size: 18px; font-weight: bold;">
                        <span style="color: #f59e0b;">TOTAL GASTO:</span>
                        <span style="color: #4ade80;">₱ ${grandTotal.toFixed(2)}</span>
                      </div>`;

      // Ipakita ang Summary gamit ang SweetAlert2
      Swal.fire({
        title: "📊 WONDERER EXPENSE SUMMARY",
        html: htmlContent,
        background: "#0f172a",
        color: "#fff",
        confirmButtonColor: "#d97706",
        confirmButtonText: "OKAY"
      });
    }
  </script>
</body>
</html>
